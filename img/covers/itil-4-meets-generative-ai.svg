<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091221"/><stop offset="1" stop-color="#0E1B34"/></linearGradient>
<radialGradient id="gl" cx="709" cy="12" r="440" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#38BDF8" stop-opacity=".38"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<linearGradient id="ga" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
<pattern id="gr" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<linearGradient id="sw"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<style>
.halo{transform-box:fill-box;transform-origin:center;animation:halo 3s ease-in-out infinite}
.core{animation:core 3s ease-in-out infinite}
.swp{animation:swp 6.5s linear infinite}
.trav{animation:trav var(--d,6s) linear infinite;offset-rotate:0deg}
.bob{transform-box:fill-box;transform-origin:center bottom;animation:bob var(--bd,2.6s) ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin var(--sd,42s) linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.typ{animation:typ 1.5s ease-in-out infinite}
.pz{transform-box:fill-box;transform-origin:center;animation:pz 2.2s ease-in-out infinite}
.bobf{animation:bobf 3.4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.12;transform:scale(.72)}50%{opacity:.6;transform:scale(1.4)}}
@keyframes core{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes swp{from{transform:translateX(-260px)}to{transform:translateX(920px)}}
@keyframes trav{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(var(--s,1.3))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes typ{0%,70%,100%{opacity:.25}35%{opacity:1}}
@keyframes pz{0%,100%{opacity:.22;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
@keyframes bobf{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect width="800" height="360" fill="url(#bg)"/><rect width="800" height="360" fill="url(#gr)"/><rect width="800" height="360" fill="url(#gl)"/>
<polygon points="457,232.0 607.0,270 457,308.0 307.0,270" fill="#13243F" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.6"/><circle  cx="444" cy="273" r="3.5" fill="#38BDF8"/><circle  cx="404" cy="278" r="3.5" fill="#38BDF8"/><circle  cx="496" cy="276" r="3.5" fill="#38BDF8"/><polygon points="457,186.0 607.0,224 457,262.0 307.0,224" fill="#13243F" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.6"/><circle  cx="502" cy="231" r="3.5" fill="#38BDF8"/><circle  cx="480" cy="229" r="3.5" fill="#38BDF8"/><polygon points="457,140.0 607.0,178 457,216.0 307.0,178" fill="#13243F" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.6"/><circle  cx="401" cy="177" r="3.5" fill="#38BDF8"/><circle  cx="389" cy="179" r="3.5" fill="#38BDF8"/><circle  cx="444" cy="173" r="3.5" fill="#38BDF8"/><circle  cx="521" cy="174" r="3.5" fill="#38BDF8"/><polygon points="457,94.0 607.0,132 457,170.0 307.0,132" fill="#13243F" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.6"/><circle  cx="478" cy="139" r="3.5" fill="#38BDF8"/><circle  cx="462" cy="137" r="3.5" fill="#38BDF8"/><circle  cx="458" cy="135" r="3.5" fill="#38BDF8"/><polygon points="457,48.0 607.0,86 457,124.0 307.0,86" fill="#2DD4BF" fill-opacity="0.3" stroke="#2DD4BF" stroke-opacity="1" stroke-width="1.6"/><circle class="pz" style="animation-delay:1.6s" cx="522" cy="89" r="3.5" fill="#2DD4BF"/><circle class="pz" style="animation-delay:0.4s" cx="446" cy="80" r="3.5" fill="#2DD4BF"/>
<g transform="skewX(-12)"><rect class="swp" x="-240" y="-20" width="200" height="400" fill="url(#sw)"/></g></svg>