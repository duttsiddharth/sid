pacity=".45" stroke-width="2"/><line x1="508" y1="180" x2="658" y2="180" stroke="#FBBF24" stroke-opacity=".8" stroke-width="2.4"/></g>
<g transform="skewX(-12)"><rect class="swp" x="-240" y="-20" width="200" height="400" fill="url(#sw)"/></g></svg>