x="637" cy="159" r="5.5" fill="#2DD4BF"/><circle class="halo" cx="432" cy="179" r="14" fill="#2DD4BF" opacity=".35" filter="url(#blur)"/><circle class="core" cx="432" cy="179" r="5.5" fill="#2DD4BF"/><circle class="halo" cx="560" cy="172" r="14" fill="#2DD4BF" opacity=".35" filter="url(#blur)"/><circle class="core" cx="560" cy="172" r="5.5" fill="#2DD4BF"/>
<g transform="skewX(-12)"><rect class="swp" x="-240" y="-20" width="200" height="400" fill="url(#sw)"/></g></svg>