<style>
.halo{transform-box:fill-box;transform-origin:center;animation:halo 4.5s ease-in-out infinite}
.core{animation:core 4.5s ease-in-out infinite}
.swp{animation:swp 9s linear infinite}
.trav{animation:trav var(--d,6s) linear infinite;offset-rotate:0deg}
.bob{transform-box:fill-box;transform-origin:center bottom;animation:bob var(--bd,2.6s) ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin var(--sd,42s) linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.typ{animation:typ 1.5s ease-in-out infinite}
.pz{transform-box:fill-box;transform-origin:center;animation:pz 3s ease-in-out infinite}
.bobf{animation:bobf 3.4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.14;transform:scale(.8)}50%{opacity:.46;transform:scale(1.22)}}
@keyframes core{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes swp{from{transform:translateX(-260px)}to{transform:translateX(920px)}}
@keyframes trav{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(var(--s,1.3))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes typ{0%,70%,100%{opacity:.25}35%{opacity:1}}
@keyframes pz{0%,100%{opacity:.28}50%{opacity:1}}
@keyframes bobf{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
