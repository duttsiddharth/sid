<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091221"/><stop offset="1" stop-color="#0E1B34"/></linearGradient>
<radialGradient id="gl" cx="583" cy="86" r="440" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6366F1" stop-opacity=".38"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
<linearGradient id="ga" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
<pattern id="gr" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<linearGradient id="sw"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<style>
.halo{transform-box:fill-box;transform-origin:center;animation:halo 3s ease-in-out infinite}
.core{animation:core 3s ease-in-out infinite}
.swp{animation:swp 6.5s linear infinite}
.trav{animation:trav var(--d,6s) linear infinite;offset-rotate:0deg}
.bob{transform-box:fill-box;transform-origin:center bottom;animation:bob var(--bd,2.6s) ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin var(--sd,42s) linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.typ{animation:typ 1.5s ease-in-out infinite}
.pz{transform-box:fill-box;transform-origin:center;animation:pz 2.2s ease-in-out infinite}
.bobf{animation:bobf 3.4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.12;transform:scale(.72)}50%{opacity:.6;transform:scale(1.4)}}
@keyframes core{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes swp{from{transform:translateX(-260px)}to{transform:translateX(920px)}}
@keyframes trav{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(var(--s,1.3))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes typ{0%,70%,100%{opacity:.25}35%{opacity:1}}
@keyframes pz{0%,100%{opacity:.22;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
@keyframes bobf{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect width="800" height="360" fill="url(#bg)"/><rect width="800" height="360" fill="url(#gr)"/><rect width="800" height="360" fill="url(#gl)"/>
<g class="spin" style="--sd:55s;transform-origin:505px 180px"><circle cx="505" cy="180" r="46" fill="none" stroke="#6366F1" stroke-opacity="0.5" stroke-width="1.4" /><circle cx="505" cy="180" r="80" fill="none" stroke="#6366F1" stroke-opacity="0.43" stroke-width="1.4" stroke-dasharray="3 7"/><circle cx="505" cy="180" r="116" fill="none" stroke="#6366F1" stroke-opacity="0.36" stroke-width="1.4" /><circle cx="505" cy="180" r="154" fill="none" stroke="#6366F1" stroke-opacity="0.29" stroke-width="1.4" stroke-dasharray="3 7"/><circle cx="505" cy="180" r="196" fill="none" stroke="#6366F1" stroke-opacity="0.21999999999999997" stroke-width="1.4" /></g><circle class="halo" cx="489" cy="137" r="13" fill="#94A3B8" opacity=".35" filter="url(#blur)"/><circle class="core" cx="489" cy="137" r="5" fill="#94A3B8"/><circle class="halo" cx="541" cy="151" r="13" fill="#94A3B8" opacity=".35" filter="url(#blur)"/><circle class="core" cx="541" cy="151" r="5" fill="#94A3B8"/><circle class="halo" cx="436" cy="139" r="13" fill="#94A3B8" opacity=".35" filter="url(#blur)"/><circle class="core" cx="436" cy="139" r="5" fill="#94A3B8"/><circle class="halo" cx="528" cy="66" r="21" fill="#A78BFA" opacity=".35" filter="url(#blur)"/><circle class="core" cx="528" cy="66" r="8" fill="#A78BFA"/><circle class="halo" cx="361" cy="234" r="13" fill="#94A3B8" opacity=".35" filter="url(#blur)"/><circle class="core" cx="361" cy="234" r="5" fill="#94A3B8"/><circle class="halo" cx="639" cy="103" r="13" fill="#94A3B8" opacity=".35" filter="url(#blur)"/><circle class="core" cx="639" cy="103" r="5" fill="#94A3B8"/><circle class="halo" cx="540" cy="-13" r="13" fill="#94A3B8" opacity=".35" filter="url(#blur)"/><circle class="core" cx="540" cy="-13" r="5" fill="#94A3B8"/><line x1="489" y1="137" x2="541" y2="151" stroke="#A78BFA" stroke-opacity=".22"/><line x1="541" y1="151" x2="436" y2="139" stroke="#A78BFA" stroke-opacity=".22"/><line x1="436" y1="139" x2="528" y2="66" stroke="#A78BFA" stroke-opacity=".22"/><line x1="528" y1="66" x2="361" y2="234" stroke="#A78BFA" stroke-opacity=".22"/><line x1="361" y1="234" x2="639" y2="103" stroke="#A78BFA" stroke-opacity=".22"/><line x1="639" y1="103" x2="540" y2="-13" stroke="#A78BFA" stroke-opacity=".22"/><circle cx="505" cy="180" r="16" fill="url(#ga)"/><circle cx="505" cy="180" r="26" fill="none" stroke="#A78BFA" stroke-opacity=".5"/>
<g transform="skewX(-12)"><rect class="swp" x="-240" y="-20" width="200" height="400" fill="url(#sw)"/></g></svg>