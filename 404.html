<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — SD Advisory</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0d0d0d; --paper:#f5f0e8; --rust:#c0440a; --gold:#b8922a; --muted:#6b6258; --line:#d9d2c4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font-family:Georgia, serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
  .wrap { max-width:560px; text-align:center; }
  .code { font-family:'DM Serif Display', Georgia, serif; font-size:clamp(5rem,20vw,9rem); line-height:1; color:var(--rust); }
  .code em { font-style:italic; color:var(--gold); }
  .label { font-family:'DM Mono', monospace; font-size:0.7rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--rust); margin:1.2rem 0 0.8rem; }
  h1 { font-family:'DM Serif Display', Georgia, serif; font-size:1.6rem; font-weight:400; margin-bottom:0.8rem; }
  p { color:var(--muted); font-size:0.95rem; line-height:1.7; margin-bottom:2rem; }
  .links { display:flex; gap:0.8rem; justify-content:center; flex-wrap:wrap; }
  a.btn { text-decoration:none; font-family:'DM Mono', monospace; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; padding:0.8rem 1.4rem; border:1px solid var(--ink); color:var(--ink); transition:all .2s; }
  a.btn:hover { background:var(--ink); color:var(--paper); }
  a.btn.primary { background:var(--rust); border-color:var(--rust); color:var(--paper); }
  a.btn.primary:hover { background:var(--ink); border-color:var(--ink); }
  .brand { margin-top:3rem; display:flex; align-items:center; justify-content:center; gap:0.6rem; }
  .brand img { width:30px; height:30px; }
  .brand span { font-family:'DM Mono', monospace; font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">4<em>0</em>4</div>
    <div class="label">// Page Not Found</div>
    <h1>This page has been decommissioned.</h1>
    <p>The URL you followed doesn’t exist — it may have moved during a recent site update. Everything you need is one click away.</p>
    <div class="links">
      <a class="btn primary" href="index.html">Home</a>
      <a class="btn" href="index.html#services">Services</a>
      <a class="btn" href="blog.html">Insights</a>
      <a class="btn" href="index.html#contact">Contact</a>
    </div>
    <div class="brand"><img src="logo-mark.png" alt="SD Advisory"><span>SD Advisory · IT Consulting</span></div>
  </div>
</body>
</html>
